metadata:
  scenario_id: "SCENARIO-03"
  name: "Dependency Substitution (Version & Checksum Mutated)"
  description: "Candidate SBOM modifies dependency package version and checksum"
  threat_actor: "Dependency Confusion / Typosquatting Attack"
  category: "Supply Chain & SBOM Security"
is_negative_control: false
policy_config:
  disallow_dependency_changes: true
  block_threshold: 70
expected_results:
  expected_decision: "BLOCK"
  expected_finding_category: "UNEXPECTED_DEPENDENCY"
  expected_risk_score: 30
  expected_exit_code: 1
  expected_audit_event: "VERIFICATION_FAILED"
