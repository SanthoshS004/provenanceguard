version: 1
disable_existing_loggers: false

formatters:
  json:
    class: "logging.Formatter"
    format: "%(message)s"

handlers:
  console:
    class: "logging.StreamHandler"
    level: "INFO"
    formatter: "json"
    stream: "ext://sys.stdout"

loggers:
  provenanceguard:
    level: "INFO"
    handlers: ["console"]
    propagate: false

root:
  level: "INFO"
  handlers: ["console"]
