[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "provenanceguard"
version = "1.0.0"
description = "Enterprise Zero-Trust Software Supply-Chain Verification & CI/CD Security Platform"
readme = "README.md"
authors = [
    { name = "ProvenanceGuard Team", email = "security@provenanceguard.internal" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.3",
    "celery>=5.3.6",
    "minio>=7.2.5",
    "httpx>=0.27.0",
    "click>=8.1.7",
    "cryptography>=42.0.0",
    "pyjwt>=2.8.0",
    "rfc8785>=0.1.4",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.scripts]
provenanceguard = "provenanceguard.apps.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
ignore = ["B008", "E501", "S101", "S105", "S106"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "S"]
ignore = ["B008", "E501", "S101", "S105", "S106"]
