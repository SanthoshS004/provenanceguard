version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: provenanceguard-postgres
    environment:
      POSTGRES_USER: provenanceguard_admin
      POSTGRES_PASSWORD: pg_dev_password_change_me
      POSTGRES_DB: provenanceguard_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provenanceguard_admin -d provenanceguard_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: provenanceguard-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: provenanceguard-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: provenanceguard-api
    ports:
      - "8000:8000"
    environment:
      PG_ENV: development
      PG_DB_HOST: postgres
      PG_REDIS_HOST: redis
      PG_MINIO_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: provenanceguard-worker
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    environment:
      PG_ENV: development
      PG_REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
