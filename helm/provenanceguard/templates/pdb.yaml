apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "provenanceguard.fullname" . }}-api-pdb
  labels:
    app.kubernetes.io/name: {{ include "provenanceguard.name" . }}
    app.kubernetes.io/component: api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "provenanceguard.name" . }}
      app.kubernetes.io/component: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "provenanceguard.fullname" . }}-dashboard-pdb
  labels:
    app.kubernetes.io/name: {{ include "provenanceguard.name" . }}
    app.kubernetes.io/component: dashboard
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "provenanceguard.name" . }}
      app.kubernetes.io/component: dashboard
