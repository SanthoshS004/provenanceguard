apiVersion: v1
kind: Service
metadata:
  name: {{ include "provenanceguard.fullname" . }}-dashboard
  labels:
    app.kubernetes.io/name: {{ include "provenanceguard.name" . }}
    app.kubernetes.io/component: dashboard
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.dashboard.ports.http }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "provenanceguard.name" . }}
    app.kubernetes.io/component: dashboard
