apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "provenanceguard.fullname" . }}-api
  labels:
    app.kubernetes.io/name: {{ include "provenanceguard.name" . }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "provenanceguard.name" . }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "provenanceguard.name" . }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ default (include "provenanceguard.fullname" .) .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: {{ include "provenanceguard.name" . }}
                    app.kubernetes.io/component: api
                topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.ports.http }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.api.ports.metrics }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "provenanceguard.fullname" . }}-config
          env:
            - name: PG_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "provenanceguard.secretName" . }}
                  key: PG_DB_PASSWORD
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /api/v1/health/liveness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/v1/health/liveness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: tmp-volume
          emptyDir: {}
