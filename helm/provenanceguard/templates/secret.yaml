{{- if and (empty .Values.existingSecret.name) (ne .Values.global.environment "production") -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "provenanceguard.fullname" . }}-test-secret
  labels:
    app.kubernetes.io/name: {{ include "provenanceguard.name" . }}
type: Opaque
stringData:
  PG_DB_PASSWORD: "pg_test_password"
  PG_REDIS_PASSWORD: ""
  PG_WEBHOOK_SECRET_KEY: "test_webhook_secret_key_32_bytes_len!"
  PG_JWT_PUBLIC_KEY: "test_jwt_key"
{{- end -}}
