apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "provenanceguard.fullname" . }}-worker
  labels:
    app.kubernetes.io/name: {{ include "provenanceguard.name" . }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "provenanceguard.name" . }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "provenanceguard.name" . }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ default (include "provenanceguard.fullname" .) .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: metrics
              containerPort: {{ .Values.worker.ports.metrics }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "provenanceguard.fullname" . }}-config
          env:
            - name: PG_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "provenanceguard.secretName" . }}
                  key: PG_DB_PASSWORD
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "from provenanceguard.apps.worker.worker_metrics import update_worker_heartbeat; exit(0 if update_worker_heartbeat() else 1)"
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        - name: tmp-volume
          emptyDir: {}
