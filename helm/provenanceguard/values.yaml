# Default values for ProvenanceGuard Helm Chart.

global:
  environment: production # production | development | testing

# External Secret Configuration (MANDATORY IN PRODUCTION)
# Production deployments MUST specify existingSecret.name referencing externally provisioned secrets.
existingSecret:
  name: "" # Set to name of existing Kubernetes Secret (e.g. "provenanceguard-prod-secrets")

# Ingress & Prometheus Namespace Selectors for NetworkPolicy
ingress:
  enabled: true
  className: nginx
  namespaceSelector: ingress-nginx
  hosts:
    - host: provenanceguard.internal
      paths:
        - path: /api/v1
          pathType: Prefix
          backend: api
        - path: /
          pathType: Prefix
          backend: dashboard

prometheus:
  namespaceSelector: prometheus

# Pod Security Standards (Zero-Trust Defaults)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  automountServiceAccountToken: false
  name: ""

# Component Specific Configurations
api:
  replicaCount: 3
  image:
    repository: provenanceguard/api
    tag: 0.1.0
    pullPolicy: IfNotPresent
  ports:
    http: 8000
    metrics: 9090
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi

worker:
  replicaCount: 2
  image:
    repository: provenanceguard/worker
    tag: 0.1.0
    pullPolicy: IfNotPresent
  ports:
    metrics: 9090
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi
  # Note: Phase 16 provides CPU/memory-based worker HPA. Queue-depth-based autoscaling is deferred.
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

dashboard:
  replicaCount: 2
  image:
    repository: provenanceguard/dashboard
    tag: 0.1.0
    pullPolicy: IfNotPresent
  ports:
    http: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
